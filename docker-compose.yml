name: real-estate-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate}
      POSTGRES_DB: ${POSTGRES_DB:-realestate_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d is required: pg_isready defaults to a database named after -U
      # when -d is omitted, so without it this repeatedly probed a
      # nonexistent "realestate" database (matching POSTGRES_USER)
      # instead of the real POSTGRES_DB (realestate_dev), logging
      # "FATAL: database "realestate" does not exist" every interval
      # even though the server itself — and the app's own /health
      # endpoint, which connects via DATABASE_URL/Prisma — were fine.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-realestate} -d ${POSTGRES_DB:-realestate_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
